name: Build Windows binary

on:
  workflow_dispatch:            # manual run: uploads the workflow artifact only.
                                # A GitHub Release is only touched by a v* tag push.
  push:
    tags: ['v*']                # every release tag builds and publishes the exe

jobs:
  build-windows:
    runs-on: windows-latest
    # Needed only by the release step at the bottom.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      # onefile is the right shape for a single-script CLI: one file to copy to
      # a workstation. It unpacks itself into a temporary folder on every start,
      # which costs about a second once - the sync then runs for days. The exe
      # needs nothing installed: Python, the CA bundle and the C runtime are
      # all inside it.
      - name: Build the binary
        run: python build_project.py
      # Prove the bundle really starts: PyInstaller happily produces an
      # executable that then dies on a missing hidden import. --version and
      # --help need no configuration, and the run below uses --config-dir, so
      # CI never relies on a config.yaml sitting next to the exe.
      - name: Smoke test the binary
        shell: pwsh
        run: |
          $version = .\dist\nginx-sync.exe --version | Out-String
          if ($version.Trim() -notmatch '^nginx-sync \d+\.\d+') { throw "unexpected --version output: $version" }
          .\dist\nginx-sync.exe --help | Out-Null
          $conf = Join-Path $env:RUNNER_TEMP 'nginx-sync-conf'
          New-Item -ItemType Directory -Path $conf -Force | Out-Null
          Set-Content -Path (Join-Path $conf 'config.yaml') -Encoding ascii -Value @(
            'source:',
            '  url: "http://127.0.0.1:9/api"',
            'targets:',
            '  - name: "Smoke"',
            '    url: "http://127.0.0.1:9/api"'
          )
          Copy-Item log.yaml $conf
          Set-Content -Path (Join-Path $conf '.env') -Encoding ascii -Value @(
            'NPM_IDENTITY=smoke@example.com',
            'NPM_SECRET=smoke'
          )
          # Port 9 (discard) refuses the connection, so the one-time sync ends
          # immediately; the log it wrote proves the folder was really read.
          .\dist\nginx-sync.exe --config-dir $conf -p 0
          if (-not (Select-String -Path (Join-Path $conf 'logs\nginx_sync.log') -Pattern 'Starting Sync' -Quiet)) {
            throw 'the binary did not read the configuration folder'
          }
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\nginx-sync.exe -Algorithm SHA256).Hash.ToLower()
          # LF endings and no BOM, so the file also works with
          # "sha256sum -c nginx-sync.exe.sha256" on Linux/WSL; Out-File would
          # write CRLF and that trailing \r becomes part of the file name.
          [System.IO.File]::WriteAllText("$PWD\dist\nginx-sync.exe.sha256", "$hash  nginx-sync.exe`n")
          Get-Content dist\nginx-sync.exe.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nginx-sync-windows
          path: |
            dist/nginx-sync.exe
            dist/nginx-sync.exe.sha256
          # The exe is already compressed, so re-compressing it only costs CPU.
          compression-level: 0
      # The release body is the matching section of RELEASE-NOTES.md. The script
      # exits non-zero when the tag and the version in log.yaml disagree, so a
      # mis-tagged build cannot publish the wrong notes. Both build workflows
      # attach to the same release: whichever finishes first creates it.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: python utils/release_notes.py --tag "${{ github.ref_name }}" --output dist/release_notes.md
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release_notes.md
          files: |
            dist/nginx-sync.exe
            dist/nginx-sync.exe.sha256
