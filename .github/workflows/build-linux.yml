name: Build Linux binary

on:
  workflow_dispatch:            # manual run: uploads the workflow artifact only.
                                # A GitHub Release is only touched by a v* tag push.
  push:
    tags: ['v*']                # every release tag builds and publishes the binary

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Needed only by the release step at the bottom.
    permissions:
      contents: write
    # Build inside Debian bullseye (glibc 2.31, Python 3.12) instead of on the
    # runner itself. A PyInstaller executable carries the libc of the Python it
    # bundles, and the Python that actions/setup-python installs is built for the
    # runner's glibc (2.39 on ubuntu-latest), so a runner build refuses to start
    # on Ubuntu 22.04 with "GLIBC_2.xx not found". The ubuntu-22.04 runner image
    # itself is being retired (unsupported from April 2027) and cannot be
    # combined with actions/setup-python, which picks a Python built for the
    # runner's own glibc. This image already carries Python, pip, git
    # (actions/checkout needs it inside a container) and the CA certificates, so
    # the steps below are the same ones a developer runs.
    container:
      image: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build the binary
        run: python build_project.py
      # Prove the bundle really starts: PyInstaller happily produces an
      # executable that then dies on a missing hidden import. --version reads
      # log.yaml next to the binary and needs no configuration, while the run
      # below uses --config-dir, which is how an administrator keeps the
      # configuration somewhere other than the binary's own folder.
      - name: Smoke test the binary
        run: |
          ./dist/nginx-sync --version
          ./dist/nginx-sync --help > /dev/null
          mkdir -p /tmp/nginx-sync-conf
          printf 'source:\n  url: "http://127.0.0.1:9/api"\ntargets:\n  - name: "Smoke"\n    url: "http://127.0.0.1:9/api"\n' > /tmp/nginx-sync-conf/config.yaml
          cp log.yaml /tmp/nginx-sync-conf/
          printf 'NPM_IDENTITY=smoke@example.com\nNPM_SECRET=smoke\n' > /tmp/nginx-sync-conf/.env
          # Port 9 (discard) refuses the connection, so the one-time sync ends
          # immediately; the log it wrote proves the folder was really read.
          ./dist/nginx-sync --config-dir /tmp/nginx-sync-conf -p 0
          grep -q "Starting Sync" /tmp/nginx-sync-conf/logs/nginx_sync.log
      - name: Generate SHA256 checksum
        run: |
          cd dist
          sha256sum nginx-sync > nginx-sync.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nginx-sync-linux
          path: |
            dist/nginx-sync
            dist/nginx-sync.sha256
          # The binary is already compressed, so re-compressing it only costs
          # CPU. This is the internal workflow artifact; the release assets
          # users download are unaffected.
          compression-level: 0
      # The release body is the matching section of RELEASE-NOTES.md. The script
      # exits non-zero when the tag and the version in log.yaml disagree, so a
      # mis-tagged build cannot publish the wrong notes.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python utils/release_notes.py \
            --tag "${{ github.ref_name }}" \
            --output dist/release_notes.md
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release_notes.md
          files: |
            dist/nginx-sync
            dist/nginx-sync.sha256
